# Deploy en el VPS. Postgres/Redis SOLO en red interna (sin puertos publicados
# al host) — ver plan, sección Seguridad. `traefik_proxy` es la red externa de
# tu Traefik ya corriendo; el servicio `robin` (Telegram, long-polling) no la
# necesita para entrar pero queda conectado por si hace falta salir; `web`
# (V7) sí la usa para publicar la Web UI, detrás del mismo middleware
# tinyauth que ya protege tus otros servicios admin (homarr, portainer, etc.).
#
# Variables (POSTGRES_PASSWORD, etc.) vienen de .env.prod — ver .env.prod.example.
name: robin

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: robin
      POSTGRES_DB: robin
      # POSTGRES_PASSWORD viene de .env.prod
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - robin_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robin -d robin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - robin_internal

  robin:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./memory:/app/memory # el vault vive fuera del contenedor - persiste, editable por SSH/Obsidian
    networks:
      - robin_internal
      - traefik_proxy # sin labels activas todavía - ver comentario arriba
    security_opt:
      - no-new-privileges:true

  # STT (V6, ver plan) — faster-whisper, servicio interno sin puerto publicado
  # (solo el brain le habla, por nombre de servicio).
  whisper:
    build: ./whisper
    restart: unless-stopped
    volumes:
      - whisper_model:/models
    networks:
      - robin_internal
    security_opt:
      - no-new-privileges:true

  # TTS (V6, ver plan) — Piper, servicio interno sin puerto publicado.
  piper:
    build: ./piper
    restart: unless-stopped
    volumes:
      - piper_voices:/voices
    networks:
      - robin_internal
    security_opt:
      - no-new-privileges:true

  # Web UI (V7, ver plan) — misma imagen que `robin`, `command` distinto.
  # Proceso aparte a propósito: así solo el de Telegram corre el Worker del
  # scheduler (brain/scheduler.ts) y no hay ambigüedad de qué proceso tiene
  # el outbound sender registrado. Sin auth propia — tinyauth (Traefik) es el
  # gate real; ver comentario en src/adapters/web/index.ts.
  web:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/adapters/web/index.ts"]
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - robin_internal
      - traefik_proxy
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.docker.network=traefik_proxy"
      - "traefik.enable=true"
      - "traefik.http.middlewares.robin-web-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.robin-web-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.robin-web-http.entrypoints=web"
      - "traefik.http.routers.robin-web-http.middlewares=robin-web-https-redirect"
      - "traefik.http.routers.robin-web-http.rule=Host(`robin.rvaldiviase.com`)"
      - "traefik.http.routers.robin-web-https.entrypoints=websecure"
      - "traefik.http.routers.robin-web-https.middlewares=tinyauth"
      - "traefik.http.routers.robin-web-https.rule=Host(`robin.rvaldiviase.com`)"
      - "traefik.http.routers.robin-web-https.tls=true"
      - "traefik.http.routers.robin-web-https.tls.certresolver=cloudflare"
      - "traefik.http.services.robin-web-https.loadbalancer.server.port=3000"

networks:
  robin_internal:
    driver: bridge
  traefik_proxy:
    external: true

volumes:
  # Volúmenes físicos ya existían con el nombre viejo (jarvis_jarvis_*) de antes
  # del rename jarvis->robin — referenciados como external en vez de copiar los
  # datos a uno nuevo, así no hay riesgo de perder nada en la migración.
  pg_data:
    external: true
    name: jarvis_jarvis_pg_data
  redis_data:
    external: true
    name: jarvis_jarvis_redis_data
  whisper_model:
  piper_voices:
