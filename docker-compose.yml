name: robin

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: robin
      POSTGRES_PASSWORD: robin_dev_local
      POSTGRES_DB: robin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robin -d robin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # STT (V6, ver plan) — faster-whisper como servicio HTTP aparte (Python).
  # Publicado en localhost porque en dev el brain corre en el host (npm run
  # chat), no en Docker.
  whisper:
    build: ./whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - whisper_model:/models

  # TTS (V6, ver plan) — Piper como servicio HTTP aparte, mismo motivo que
  # whisper (el brain corre en el host en dev, no en Docker).
  piper:
    build: ./piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - piper_voices:/voices

volumes:
  pg_data:
  redis_data:
  whisper_model:
  piper_voices:
